<style>
:root{
  --paper:#F5EFDF;
  --paper-2:#EAE1C8;
  --ink:#1C1B17;
  --green:#0E3B2C;
  --gold:#C8921A;
  --yellow:#F3C53B;
  --red:#B22A1E;
  --muted:rgba(28,27,23,.74);
  --font-head:'Fraunces',Georgia,serif;
  --font-body:'Manrope',system-ui,sans-serif;
  --section:clamp(72px,10vw,120px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
ul{list-style:none}
section[id]{scroll-margin-top:72px}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--font-head);line-height:1.12;font-weight:700}
h1{font-size:clamp(2rem,6.4vw,3.9rem);font-weight:900;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,4.6vw,2.8rem);font-weight:900}
h3{font-size:1.3rem}
.eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:14px;display:block}
.mark{background:linear-gradient(transparent 62%,var(--yellow) 62% 92%,transparent 92%)}
.sec{padding:var(--section) 0;position:relative}
.sec-head{max-width:640px;margin-bottom:48px}
.sec-head p{margin-top:14px;color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.divider{display:block;width:100%;height:24px;color:var(--green);opacity:.55}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 1rem var(--font-body);text-decoration:none;padding:14px 22px;border-radius:10px;border:2px solid var(--ink);min-height:48px;transition:transform .15s,box-shadow .15s,background .15s,color .15s;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn-wa{background:var(--green);color:var(--paper);border-color:var(--green)}
.btn-wa:hover{box-shadow:4px 4px 0 var(--yellow)}
.btn-call{background:transparent;color:var(--ink)}
.btn-call:hover{background:var(--ink);color:var(--paper)}
.btn-yellow{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.btn-big{font-size:1.15rem;padding:18px 30px}
.btn.sm{padding:9px 14px;min-height:42px;font-size:.9rem;border-radius:8px}

/* header */
.site-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
.bar{display:flex;align-items:center;gap:10px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.logo{width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--yellow);display:grid;place-items:center;font:900 1.4rem var(--font-head);border:2px solid var(--gold)}
.brand b{font:900 1.2rem var(--font-head);line-height:1}
.brand small{display:none;font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:2px solid var(--ink);padding:10px 20px 18px;flex-direction:column}
.nav.open{display:flex}
.nav a{padding:12px 0;font-weight:700;text-decoration:none;border-bottom:1px dashed rgba(28,27,23,.3)}
.nav a:hover{color:var(--red)}
.hdr-cta{display:flex;gap:8px}
.hdr-cta .btn span{display:none}
.hdr-cta .btn{padding:9px 12px}
.burger{background:none;border:2px solid var(--ink);border-radius:8px;width:44px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}

/* hero */
.hero{padding:clamp(40px,7vw,88px) 0 calc(var(--section) * .9);position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(14,59,44,.1) 35px 36px)}
.hero::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(178,42,30,.4)}
.hero-grid{display:grid;gap:40px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);padding:6px 12px;border-radius:6px;margin-bottom:22px}
.hero p.lead{font-size:1.1rem;margin:22px 0 10px;color:var(--muted);max-width:560px}
.proof{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--green);margin-bottom:28px;flex-wrap:wrap}
.proof svg{width:18px;height:18px;fill:var(--gold);stroke:none}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;margin-right:-20px}
.hero-img{background:var(--green);border:3px solid var(--ink);border-radius:6px 90px 6px 6px;overflow:hidden;aspect-ratio:4/4.4;box-shadow:10px 10px 0 var(--gold);position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:-6px;bottom:-26px;width:110px;height:110px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;text-align:center;font:900 1rem/1.1 var(--font-head);transform:rotate(-10deg)}
.badge small{display:block;font:800 .62rem var(--font-body);letter-spacing:.1em;text-transform:uppercase}
.pencil{position:absolute;right:14px;top:-34px;width:150px;height:30px;color:var(--ink);transform:rotate(-8deg)}

/* trust */
.trust{background:var(--green);color:var(--paper);padding:56px 0 52px;position:relative;margin-top:30px}
.big-year{position:absolute;right:3%;top:-52px;font:900 clamp(90px,22vw,230px)/1 var(--font-head);color:transparent;-webkit-text-stroke:2px var(--gold);pointer-events:none;user-select:none;z-index:2}
.trust-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 20px;position:relative;z-index:3}
.stat b{display:block;font:900 clamp(2rem,6vw,3rem)/1 var(--font-head);color:var(--yellow)}
.stat span{font-size:.92rem;opacity:.9;display:block;margin-top:6px}

/* services */
.cards{display:grid;gap:18px}
.card{border:2px solid var(--ink);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px;background:var(--paper-2);position:relative}
.card .ico{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center}
.card .ico svg{width:24px;height:24px}
.card p{color:inherit;opacity:.85;flex:1}
.card .price{font:900 1.5rem var(--font-head)}
.card .price small{font:600 .85rem var(--font-body);opacity:.8}
.card-cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-weight:800;text-decoration:none;border:2px solid currentColor;border-radius:8px;padding:10px 14px;min-height:44px;font-size:.92rem}
.card-cta:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.dark{background:var(--green);color:var(--paper)}
.card.dark .ico{background:var(--yellow);color:var(--green)}
.card.dark .card-cta:hover{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.card.gold{background:var(--yellow)}
.card.tall{border-top-width:8px;border-top-color:var(--red)}

/* about */
.about{background:var(--paper-2)}
.about-grid{display:grid;gap:44px}
.owner{display:flex;flex-direction:column;gap:14px}
.avatar{width:150px;height:150px;border-radius:50%;background:var(--green);color:var(--yellow);display:grid;place-items:center;font:900 3.4rem var(--font-head);border:4px solid var(--gold);box-shadow:8px 8px 0 var(--ink)}
.owner b{font:900 1.4rem var(--font-head)}
.owner span{color:var(--muted);font-weight:600}
.about-text p{margin-bottom:16px;max-width:620px}
.diff{margin-top:28px;display:grid;gap:12px}
.diff li{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.diff svg{width:22px;height:22px;fill:var(--gold);stroke:var(--ink);stroke-width:1.2;margin-top:2px}

/* gallery */
.grid-g{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:150px;gap:12px}
.g{position:relative;background:var(--green);border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:0}
.g img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.g:hover img{transform:scale(1.04)}
.g figcaption{position:absolute;left:0;bottom:0;background:var(--ink);color:var(--paper);font-size:.74rem;font-weight:800;padding:5px 10px;letter-spacing:.04em}
.g1,.g6{grid-column:span 2}
.g4{grid-row:span 2}

/* reviews */
.reviews{display:grid;gap:20px}
.rev{border:2px solid var(--ink);border-radius:10px;padding:26px;background:var(--paper);box-shadow:6px 6px 0 var(--ink)}
.rev:nth-child(2){background:var(--yellow)}
.stars{display:flex;gap:3px;margin-bottom:12px}
.stars svg{width:20px;height:20px;fill:var(--red);stroke:var(--ink);stroke-width:1}
.rev p{margin-bottom:16px}
.rev b{display:block}
.rev span{font-size:.88rem;color:var(--muted);font-weight:600}

/* pricing */
.pricing{background:var(--green);color:var(--paper);overflow:hidden}
.pricing .eyebrow{color:var(--yellow)}
.pricing-grid{display:grid;gap:40px;align-items:start}
.sheet{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-left:10px solid var(--red);border-radius:6px;padding:10px 22px 22px;box-shadow:10px 10px 0 var(--gold);transform:rotate(-1deg);background-image:repeating-linear-gradient(to bottom,transparent 0 53px,rgba(14,59,44,.18) 53px 54px)}
.sheet li{display:flex;align-items:baseline;gap:10px;height:54px;line-height:54px;font-weight:700}
.sheet li i{flex:1;border-bottom:2px dotted rgba(28,27,23,.45);transform:translateY(-6px)}
.sheet li em{font:900 1.2rem var(--font-head);font-style:normal;white-space:nowrap}
.sheet li em.inc{color:var(--green)}
.price-note{margin-top:24px;opacity:.9;max-width:420px}
.price-note a{margin-top:20px}

/* contact */
.contact-grid{display:grid;gap:36px}
.hours{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:18px 0 26px}
.hours div{padding:11px 16px;border-bottom:1px solid rgba(28,27,23,.25);font-weight:600}
.hours div:nth-child(even){background:var(--paper-2);font-weight:800;text-align:right}
.hours div:nth-last-child(-n+2){border-bottom:0}
.hours .closed{color:var(--red)}
.methods{display:grid;gap:12px}
.method{display:flex;gap:14px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:14px 16px;text-decoration:none;font-weight:700;background:var(--paper-2)}
.method:hover{background:var(--yellow)}
.method small{display:block;font-weight:600;color:var(--muted);font-size:.8rem}
.method svg{width:26px;height:26px}
.addr{margin-top:14px;font-weight:600}
.map{border:3px solid var(--ink);border-radius:10px;overflow:hidden;min-height:340px;box-shadow:8px 8px 0 var(--gold);background:var(--paper-2)}
.map iframe{width:100%;height:100%;min-height:380px;border:0;display:block}

/* footer */
footer{background:var(--ink);color:var(--paper);padding:72px 0 28px}
.foot-grid{display:grid;gap:36px}
footer h3{font-size:1.7rem;color:var(--yellow)}
footer p{opacity:.85;margin-top:6px}
footer ul{display:grid;gap:8px;margin-top:10px}
footer ul a{text-decoration:none;opacity:.9}
footer ul a:hover{color:var(--yellow)}
footer h4{font:800 .78rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.foot-cta{margin-top:56px;padding-top:36px;border-top:2px dashed rgba(245,239,223,.3);text-align:left}
.foot-cta .btn{width:100%}
.foot-bottom{margin-top:36px;font-size:.78rem;opacity:.75;display:flex;flex-direction:column;gap:6px}
.built{font-size:.72rem;opacity:.9}

/* sticky bottom bar */
.bottom-bar{display:none}

/* breakpoints */
@media (min-width:520px){
  .hdr-cta .btn span{display:inline}
  .brand small{display:block}
  .cards{grid-template-columns:1fr 1fr}
  .cards .wide{grid-column:span 2}
  .grid-g{grid-auto-rows:170px}
  .reviews{grid-template-columns:1fr 1fr}
  .foot-cta .btn{width:auto}
}
@media (min-width:821px){
  .burger{display:none}
  .nav{display:flex;position:static;flex-direction:row;gap:22px;border:0;padding:0;background:none}
  .nav a{border:0;padding:6px 0;font-size:.95rem}
  .bar{gap:20px}
  .brand{margin-right:0}
  .nav{margin-left:auto}
  .hero-grid{grid-template-columns:1.15fr .85fr;gap:64px}
  .about-grid{grid-template-columns:.7fr 1.3fr;gap:80px}
  .pricing-grid{grid-template-columns:.8fr 1.2fr;gap:80px}
  .sheet{margin-right:-60px;padding:10px 34px 26px}
  .contact-grid{grid-template-columns:.9fr 1.1fr;gap:56px}
  .foot-grid{grid-template-columns:1.4fr 1fr 1fr}
  .reviews{grid-template-columns:1.2fr 1fr .9fr;align-items:start}
  .rev:nth-child(2){margin-top:36px}
  .rev:nth-child(3){margin-top:-12px}
  .grid-g{grid-template-columns:repeat(4,1fr);grid-auto-rows:190px}
  .g1{grid-column:1/3;grid-row:1/3}
  .g2{grid-column:3;grid-row:1}
  .g3{grid-column:3;grid-row:2}
  .g4{grid-column:4;grid-row:1/3}
  .g5{grid-column:1;grid-row:3}
  .g6{grid-column:2/4;grid-row:3}
  .g7{grid-column:4;grid-row:3}
  .trust-grid{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:1081px){
  .cards{grid-template-columns:repeat(12,1fr);gap:22px}
  .cards .c1{grid-column:span 5}
  .cards .c2{grid-column:span 4}
  .cards .c3{grid-column:span 3}
  .cards .c4{grid-column:span 3}
  .cards .c5{grid-column:span 5}
  .cards .c6{grid-column:span 4}
  .cards .wide{grid-column:auto}
  .hero-visual{margin-right:-90px}
  .card{padding:30px}
}
@media (max-width:768px){
  body{padding-bottom:68px}
  .bottom-bar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:60;border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);background:var(--ink)}
  .bottom-bar a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;font-weight:800;text-decoration:none;font-size:1.02rem}
  .bottom-bar .bb-call{background:var(--yellow);color:var(--ink)}
  .bottom-bar .bb-wa{background:var(--green);color:var(--paper)}
}
@media (max-width:519px){
  .wrap{width:calc(100% - 32px)}
  .hero-visual{margin-right:0}
  .badge{width:92px;height:92px;font-size:.88rem}
  .pencil{width:110px}
  .big-year{top:-34px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

  <div class="wrap bar">
